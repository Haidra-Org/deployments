    horde_alloy_unix_exporter_set_collectors: []
    horde_alloy_unix_exporter_enable_collectors: []
    horde_alloy_unix_exporter_disable_collectors: []
    horde_alloy_unix_exporter_include_exporter_metrics: false
    horde_alloy_unix_exporter_textfile_directory: ""
    horde_alloy_unix_exporter_filesystem_mount_points_exclude: ""
    horde_alloy_extra_scrape_targets: []
    horde_alloy_start_service: false

  tasks:
    - name: Apply horde_alloy role via include_role
      ansible.builtin.include_role:
        name: horde_alloy

  post_tasks:
    - name: Read rendered Alloy config (role include)
      ansible.builtin.slurp:
        path: "{{ horde_alloy_config_dir }}/config.alloy"
      register: _role_config

    - name: Assert metrics and log pipelines rendered via role include
      ansible.builtin.assert:
        that:
          - "'prometheus.exporter.unix' in (_role_config.content | b64decode)"
          - "'prometheus.remote_write' in (_role_config.content | b64decode)"
          - "'loki.source.journal' in (_role_config.content | b64decode)"
          - "'loki.write' in (_role_config.content | b64decode)"
          - "'mimir.test.local' in (_role_config.content | b64decode)"
          - "'loki.test.local' in (_role_config.content | b64decode)"
          - "'basic_auth' in (_role_config.content | b64decode)"
          - "'test-tenant' in (_role_config.content | b64decode)"
        fail_msg: "Role include must produce the same config as direct template rendering"

    - name: Assert trace pipeline is present with default settings
      ansible.builtin.assert:
        that:
          - "'otelcol.receiver.otlp' in (_role_config.content | b64decode)"
