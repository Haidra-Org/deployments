    # Trace pipeline knobs (newly added to role defaults; declared here to
    # keep this test resilient to default flips. Override per-play above if
    # you want to exercise filter/tail_sampling rendering.)
    horde_alloy_trace_filter_enabled: false
    horde_alloy_trace_filter_exclude_spans: []
    horde_alloy_trace_tail_sampling_enabled: false
    horde_alloy_trace_sampling_decision_wait: "5s"
    horde_alloy_trace_sampling_num_traces: 50000
    horde_alloy_trace_sampling_expected_new_per_sec: 50
    horde_alloy_trace_sampling_latency_ms: 1000
    horde_alloy_trace_sampling_probability: 1
    # OTLP-direct mimir endpoint (separate from prometheus remote_write endpoint).
    horde_alloy_mimir_otlp_endpoint: ""
    horde_alloy_collect_profiles: false
    horde_alloy_pyroscope_endpoint: ""
    horde_alloy_forward_otlp_metrics: false
    horde_alloy_log_labels: {}
    horde_alloy_external_labels: {}
    horde_alloy_extra_scrape_targets: []
    horde_alloy_mimir_endpoint: ""
    horde_alloy_tempo_endpoint: ""
    horde_alloy_docker_log_filter_label: "horde.logs"
    horde_alloy_docker_log_filter_value: "true"
    horde_alloy_docker_label_map:
      "horde.app": "app"
      "horde.component": "component"

  tasks:
    - name: Deploy Alloy configuration (Docker log collection)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../roles/horde_alloy/templates/config.alloy.j2"
        dest: "{{ horde_alloy_config_dir }}/config.alloy"
        owner: alloy
        group: alloy
        mode: "0640"

    - name: Read rendered Alloy config (Docker logs)
      ansible.builtin.slurp:
        path: "{{ horde_alloy_config_dir }}/config.alloy"
      register: horde_alloy_docker_config

    - name: Assert Docker discovery is present
      ansible.builtin.assert:
        that:
          - "'discovery.docker' in (horde_alloy_docker_config.content | b64decode)"
          - "'discovery.relabel' in (horde_alloy_docker_config.content | b64decode)"
          - "'loki.source.docker' in (horde_alloy_docker_config.content | b64decode)"
          - "'loki.process' in (horde_alloy_docker_config.content | b64decode)"
          - "'loki.write \"loki_docker\"' in (horde_alloy_docker_config.content | b64decode)"
          - "'tenant_id = \"app-tenant\"' in (horde_alloy_docker_config.content | b64decode)"
          - "'forward_to = [loki.write.loki_docker.receiver]' in (horde_alloy_docker_config.content | b64decode)"
        fail_msg: "Docker log collection pipeline must be present when enabled"

    - name: Assert Docker log level parsing is present
      ansible.builtin.assert:
        that:
          - "'parsed_level' in (horde_alloy_docker_config.content | b64decode)"
          - "'kv_level' in (horde_alloy_docker_config.content | b64decode)"
          - "'source     = \"level\"' in (horde_alloy_docker_config.content | b64decode)"
        fail_msg: "Docker log collection must parse application levels into the level label"

    - name: Assert opt-in label filter is present
      ansible.builtin.assert:
        that:
          - "'__meta_docker_container_label_horde_logs' in (horde_alloy_docker_config.content | b64decode)"
          - "'action        = \"keep\"' in (horde_alloy_docker_config.content | b64decode)"
        fail_msg: "Docker log filter must keep only containers with horde.logs label"

    - name: Assert Docker label extraction rules are present
      ansible.builtin.assert:
        that:
          - "'__meta_docker_container_label_horde_app' in (horde_alloy_docker_config.content | b64decode)"
          - "'__meta_docker_container_label_horde_component' in (horde_alloy_docker_config.content | b64decode)"
          - "'\"app\"' in (horde_alloy_docker_config.content | b64decode)"
          - "'\"component\"' in (horde_alloy_docker_config.content | b64decode)"
        fail_msg: "Docker label extraction must promote horde.app and horde.component to Loki stream labels"

