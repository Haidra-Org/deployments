    - name: Assert no basic_auth block when username is empty
      ansible.builtin.assert:
        that:
          - "'basic_auth' not in (horde_alloy_metrics_only.content | b64decode)"
        fail_msg: "basic_auth block should not appear when horde_alloy_basic_auth_username is empty"

# ---------------------------------------------------------------------------
# Play 3: Test fail-fast rejects default password
# ---------------------------------------------------------------------------
- name: Test horde_alloy - Fail-fast on default password
  hosts: testhost
  become: true
  gather_facts: false

  tasks:
    - name: Attempt validation with default password (should fail)
      block:
        - name: Run assertion with default password
          ansible.builtin.assert:
            that:
              - "'changeme-alloy' != 'changeme-alloy'"
            fail_msg: >-
              horde_alloy_basic_auth_password is still set to the insecure default.
              Override it in your inventory or vault.

        - name: Fail if assertion did not reject default
          ansible.builtin.fail:
            msg: "Should have failed with default password"

      rescue:
        - name: Confirm expected failure
          ansible.builtin.debug:
            msg: "PASS — Fail-fast correctly rejected default Alloy password"

# ---------------------------------------------------------------------------
# Play 4: String toggle behavior (inventory-style values)
# ---------------------------------------------------------------------------
- name: Test horde_alloy - String toggle behavior
  hosts: testhost
  become: true
  gather_facts: true

  vars:
    horde_alloy_config_dir: "/etc/alloy"
    horde_alloy_mimir_endpoint: ""
    horde_alloy_loki_endpoint: ""
    horde_alloy_tempo_endpoint: ""
    horde_alloy_basic_auth_username: ""
    horde_alloy_basic_auth_password: ""
    horde_alloy_collect_metrics: "false"
    horde_alloy_collect_logs: "false"
    horde_alloy_collect_traces: "false"
    # Trace pipeline knobs (newly added to role defaults; declared here to
    # keep this test resilient to default flips. Override per-play above if
    # you want to exercise filter/tail_sampling rendering.)
    horde_alloy_trace_filter_enabled: false
    horde_alloy_trace_filter_exclude_spans: []
    horde_alloy_trace_tail_sampling_enabled: false
    horde_alloy_trace_sampling_decision_wait: "5s"
    horde_alloy_trace_sampling_num_traces: 50000
    horde_alloy_trace_sampling_expected_new_per_sec: 50
    horde_alloy_trace_sampling_latency_ms: 1000
    horde_alloy_trace_sampling_probability: 1
    # OTLP-direct mimir endpoint (separate from prometheus remote_write endpoint).
    horde_alloy_mimir_otlp_endpoint: ""
    horde_alloy_collect_profiles: false
    horde_alloy_pyroscope_endpoint: ""
    horde_alloy_collect_journal: "false"
    horde_alloy_collect_docker_logs: "false"
    horde_alloy_collect_log_files: []
    horde_alloy_forward_otlp_metrics: "false"
    horde_alloy_external_labels: {}
    horde_alloy_log_labels: {}
    horde_alloy_extra_scrape_targets: []
    horde_alloy_scrape_interval: "15s"
    horde_alloy_unix_exporter_filesystem_fs_types_exclude: "^(tmpfs|overlay|nsfs|cgroup.*|tracefs|^bpf|ramfs|squashfs|sysfs|proc|mqueue|devpts)$"
    horde_alloy_unix_exporter_filesystem_mount_timeout: "10s"
    horde_alloy_journal_app_rules: []
    horde_alloy_journal_parse_level: true
    horde_alloy_otlp_listen_address: "127.0.0.1"
    horde_alloy_otlp_grpc_port: 4317
    horde_alloy_otlp_http_port: 4318
    horde_alloy_trace_batch_timeout: "5s"
    horde_alloy_trace_batch_size: 8192
    horde_alloy_log_level: "warn"
    horde_alloy_tenant_id: "infra"
    horde_alloy_otlp_metrics_tenant_id: "infra"

  tasks:
    - name: Validate endpoint gating with string false toggles
      ansible.builtin.assert:
        that:
          - >-
            horde_alloy_mimir_endpoint | length > 0
            or not (
              (horde_alloy_collect_metrics | bool)
              or (
                (horde_alloy_collect_traces | bool)
                and (horde_alloy_forward_otlp_metrics | bool)
              )
            )
          - horde_alloy_loki_endpoint  | length > 0 or not (horde_alloy_collect_logs | bool)
          - horde_alloy_tempo_endpoint | length > 0 or not (horde_alloy_collect_traces | bool)
        fail_msg: "String false toggles must disable endpoint requirements"

    - name: Assert OTLP metric forwarding requires Mimir endpoint
      block:
        - name: Run validation with traces/OTLP metrics enabled and no Mimir endpoint
          ansible.builtin.assert:
            that:
              - >-
                horde_alloy_mimir_endpoint | length > 0
                or not (
                  (false | bool)
                  or (
                    (true | bool)
                    and (true | bool)
                  )
                )
            fail_msg: "Mimir endpoint required when OTLP metrics forwarding is enabled"

        - name: Fail if validation did not reject missing Mimir endpoint
          ansible.builtin.fail:
            msg: "Expected validation failure for OTLP metric forwarding without Mimir endpoint"

      rescue:
        - name: Confirm expected OTLP forwarding validation failure
          ansible.builtin.debug:
            msg: "PASS — OTLP metrics forwarding correctly requires Mimir endpoint"

    - name: Deploy Alloy configuration (string toggles)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../roles/horde_alloy/templates/config.alloy.j2"
        dest: "{{ horde_alloy_config_dir }}/config.alloy"
        owner: alloy
        group: alloy
        mode: "0640"

    - name: Read rendered Alloy config (string toggles)
      ansible.builtin.slurp:
        path: "{{ horde_alloy_config_dir }}/config.alloy"
      register: horde_alloy_string_toggles

    - name: Assert all pipelines are absent when toggles are string false
      ansible.builtin.assert:
        that:
          - '''prometheus.exporter.unix "node"'' not in (horde_alloy_string_toggles.content | b64decode)'
          - '''loki.source.journal "systemd"'' not in (horde_alloy_string_toggles.content | b64decode)'
          - '''otelcol.receiver.otlp "local"'' not in (horde_alloy_string_toggles.content | b64decode)'
        fail_msg: "String false toggles must disable template pipelines"

# ---------------------------------------------------------------------------
# Play 5: Docker log collection with label filtering
# ---------------------------------------------------------------------------
- name: Test horde_alloy - Docker log collection with label filtering
  hosts: testhost
  become: true
  gather_facts: true

  vars:
    horde_alloy_config_dir: "/etc/alloy"
    horde_alloy_log_level: "warn"
    horde_alloy_loki_endpoint: "https://loki.test.local/loki/api/v1/push"
    horde_alloy_tenant_id: "test-tenant"
    horde_alloy_docker_logs_tenant_id: "app-tenant"
    horde_alloy_basic_auth_username: "alloy"
    horde_alloy_basic_auth_password: "test-secret-not-default"
    horde_alloy_tls_ca_cert: ""
    horde_alloy_collect_metrics: false
    horde_alloy_collect_logs: true
    horde_alloy_collect_journal: false
    horde_alloy_journal_parse_level: true
    horde_alloy_collect_log_files: []
    horde_alloy_collect_docker_logs: true
