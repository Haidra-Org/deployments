---
# requires: docker-daemon
# idempotency: skip
# Runtime integration test: starts Docker Compose services and validates health.
#
# Unlike render-only tests (horde_monitoring_start_services: false), this test
# actually boots the monitoring stack and verifies that Mimir, S3 storage,
# Grafana, and Memcached are healthy and accepting connections.
#
# Requirements:
#   - Docker daemon running in the test container (--privileged)
#   - Sufficient memory (≥2GB recommended)
#
# This test uses a minimal configuration: Mimir + Grafana + S3 storage (core stack),
# no Loki/Tempo/Pyroscope, no HAProxy, no dashboards.

- name: Test runtime services - core stack health
  hosts: testhost
  become: true
  gather_facts: true

  vars:
    horde_monitoring_install_mimir: true
    horde_monitoring_install_grafana: true
    horde_monitoring_install_loki: false
    horde_monitoring_install_tempo: false
    horde_monitoring_install_pyroscope: false
    horde_monitoring_configure_firewall: false
    horde_monitoring_configure_haproxy: false
    horde_monitoring_grafana_admin_password: "test-runtime-pass"
    horde_monitoring_s3_access_key: "GK00112233445566778899aabb"
    horde_monitoring_s3_access_key_name: "runtime-test-key"
    horde_monitoring_s3_secret_key: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
    horde_monitoring_s3_rpc_secret: "ffeeddccbbaa99887766554433221100ffeeddccbbaa99887766554433221100"
    horde_monitoring_s3_admin_token: "test-runtime-admin-token"
    horde_monitoring_application_tenant_id: "app-test"
    horde_monitoring_infrastructure_tenant_id: "infra-test"
    horde_monitoring_public_tenant_id: "public-test"
    horde_monitoring_grafana_anonymous_enabled: false
    horde_monitoring_grafana_provision_dashboards: false
    horde_monitoring_host_filesystem_metrics_available: true
    # Actually start services — the point of this test
    horde_monitoring_start_services: true
    horde_monitoring_mimir_backup_enabled: false
    # Reduce resource footprint for CI containers
    horde_monitoring_mimir_memory_limit: "1g"
    horde_monitoring_s3_memory_limit: "256m"
    # Grafana 12.x can exceed 256m during startup/migration even in this
    # minimal runtime test. Keep the test at the role default so health checks
    # fail for real service issues rather than CI-only OOM restarts.
    horde_monitoring_grafana_memory_limit: "512m"
    horde_monitoring_mimir_memcached_memory_mb: 64
    horde_monitoring_mimir_memcached_memory_limit: "128m"

  roles:
    - role: horde_monitoring

  post_tasks:
    - name: Verify S3 storage health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ horde_monitoring_s3_admin_port | default(3903) }}/health"
        method: GET
        status_code: 200
      register: horde_monitoring_s3_health
      retries: 20
      delay: 3
      until: horde_monitoring_s3_health.status == 200

    - name: Assert S3 storage is healthy
      ansible.builtin.assert:
        that:
          - horde_monitoring_s3_health.status == 200
        fail_msg: "S3 storage health check failed"

    - name: Verify Mimir ready endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:9009/ready"
        method: GET
        status_code: 200
      register: horde_monitoring_mimir_health
      retries: 25
      delay: 5
      until: horde_monitoring_mimir_health.status == 200

    - name: Assert Mimir is ready
      ansible.builtin.assert:
        that:
          - horde_monitoring_mimir_health.status == 200
        fail_msg: "Mimir ready check failed"

    - name: Verify Grafana health endpoint
      block:
        - name: Wait for Grafana health endpoint
          ansible.builtin.uri:
            url: "http://127.0.0.1:3000/api/health"
            method: GET
            status_code: 200
          register: horde_monitoring_grafana_health
          retries: 20
          delay: 3
          until: horde_monitoring_grafana_health.status == 200
      rescue:
        - name: Capture Grafana container status
          ansible.builtin.command:
            argv:
              - docker
              - inspect
              - grafana
              - --format
              - "{{ '{{json .State}}' }}"
          register: horde_monitoring_grafana_state
          changed_when: false
          failed_when: false

        - name: Capture recent Grafana logs
          ansible.builtin.command:
            argv:
              - docker
              - logs
              - --tail
              - "120"
              - grafana
          register: horde_monitoring_grafana_logs
          changed_when: false
          failed_when: false

        - name: Fail with Grafana diagnostics
          ansible.builtin.fail:
            msg: |-
              Grafana health endpoint did not become ready.
              Last health result: {{ horde_monitoring_grafana_health.msg | default(horde_monitoring_grafana_health.status | default('unknown')) }}
              Container state: {{ horde_monitoring_grafana_state.stdout | default('(unavailable)') }}
              Recent logs:
              {{ horde_monitoring_grafana_logs.stderr | default('') }}
              {{ horde_monitoring_grafana_logs.stdout | default('') }}

    - name: Assert Grafana is healthy
      ansible.builtin.assert:
        that:
          - horde_monitoring_grafana_health.status == 200
        fail_msg: "Grafana health check failed"

    - name: Push a test metric to Mimir via remote_write
      ansible.builtin.uri:
        url: "http://127.0.0.1:9009/api/v1/push"
        method: POST
        headers:
          Content-Type: "application/x-protobuf"
          X-Scope-OrgID: "app-test"
        # Mimir returns 400 for an empty/invalid protobuf body,
        # but 200/202 for valid ones, and crucially NOT 404/503.
        # A 400 confirms the endpoint is live and processing requests.
        status_code: [200, 202, 400]
      register: horde_monitoring_mimir_push

    - name: Assert Mimir push endpoint is responsive
      ansible.builtin.assert:
        that:
          - horde_monitoring_mimir_push.status in [200, 202, 400]
        fail_msg: "Mimir push endpoint is not responding (got {{ horde_monitoring_mimir_push.status }})"

    - name: Query Mimir app tenant
      ansible.builtin.uri:
        url: "http://127.0.0.1:9009/prometheus/api/v1/query?query=up"
        method: GET
        headers:
          X-Scope-OrgID: "app-test"
        status_code: 200
      register: horde_monitoring_mimir_query_app

    - name: Assert Mimir app tenant query works
      ansible.builtin.assert:
        that:
          - horde_monitoring_mimir_query_app.status == 200
          - "'resultType' in (horde_monitoring_mimir_query_app.content | default(horde_monitoring_mimir_query_app.json | to_json))"
        fail_msg: "Mimir query failed for app tenant"

    - name: Query Mimir infra tenant
      ansible.builtin.uri:
        url: "http://127.0.0.1:9009/prometheus/api/v1/query?query=up"
        method: GET
        headers:
          X-Scope-OrgID: "infra-test"
        status_code: 200
      register: horde_monitoring_mimir_query_infra

    - name: Assert Mimir infra tenant query works
      ansible.builtin.assert:
        that:
          - horde_monitoring_mimir_query_infra.status == 200

    - name: List Grafana datasources via API
      ansible.builtin.uri:
        url: "http://127.0.0.1:3000/api/datasources"
        method: GET
        user: "admin"
        password: "test-runtime-pass"
        force_basic_auth: true
        status_code: 200
      register: horde_monitoring_grafana_ds

    - name: Assert expected datasources exist
      ansible.builtin.assert:
        that:
          - horde_monitoring_grafana_ds.json | length >= 2
          - horde_monitoring_grafana_ds.json | map(attribute='name') | select('search', 'AI Horde App') | list | length > 0
          - horde_monitoring_grafana_ds.json | map(attribute='name') | select('search', 'Infrastructure') | list | length > 0
        fail_msg: "Expected datasources not found in Grafana: {{ horde_monitoring_grafana_ds.json | map(attribute='name') | list }}"

    - name: List running Docker containers
      ansible.builtin.command: docker ps --format '{{ '{{' }}.Names{{ '}}' }}'
      register: docker_ps
      changed_when: false

    - name: Assert core containers are running
      ansible.builtin.assert:
        that:
          - "'mimir' in docker_ps.stdout"
          - "'s3-store' in docker_ps.stdout"
          - "'grafana' in docker_ps.stdout"
          - "'memcached' in docker_ps.stdout"
        fail_msg: "Expected containers not running: {{ docker_ps.stdout_lines }}"

    - name: Check systemd service status
      ansible.builtin.systemd:
        name: mimir-monitoring
      register: horde_monitoring_mimir_svc

    - name: Assert systemd service is active
      ansible.builtin.assert:
        that:
          - horde_monitoring_mimir_svc.status.ActiveState == 'active'
        fail_msg: "mimir-monitoring service is not active: {{ horde_monitoring_mimir_svc.status.ActiveState }}"

    - name: Stop monitoring stack
      ansible.builtin.command: docker compose down
      args:
        chdir: /opt/mimir
      changed_when: true
