---
# Test playbook: horde_stats_exporter role (Docker Compose render only).
# risk-category: deploy-safety, security, fail-fast
#
# Play 1: Default rendering — verify exporter_config.yaml + docker-compose.yml
#         render correctly with the GHCR image, loopback bind, healthcheck,
#         and required labels.
# Play 2: Image digest pin — verify compose ref becomes "image@sha256:..."
#         when horde_stats_exporter_image_digest is set.
# Play 3: Invalid digest — fail-fast guard.

- name: Test horde_stats_exporter render (defaults)
  hosts: testhost
  become: true
  gather_facts: false
  vars:
    horde_stats_exporter_start_services: false
    horde_stats_exporter_base_dir: /opt/horde-stats-exporter-default
  roles:
    - horde_stats_exporter

  post_tasks:
    - name: Stat docker-compose.yml
      ansible.builtin.stat:
        path: /opt/horde-stats-exporter-default/docker-compose.yml
      register: _compose

    - name: Assert docker-compose.yml exists with expected permissions
      ansible.builtin.assert:
        that:
          - _compose.stat.exists
          - _compose.stat.pw_name == "root"
          - _compose.stat.mode == "0644"
        fail_msg: "docker-compose.yml missing or wrong permissions"

    - name: Read docker-compose.yml
      ansible.builtin.slurp:
        src: /opt/horde-stats-exporter-default/docker-compose.yml
      register: _compose_content

    - name: Assert compose has expected service shape
      ansible.builtin.assert:
        that:
          - "'stats-exporter:' in (_compose_content.content | b64decode)"
          - "'container_name: horde-stats-exporter' in (_compose_content.content | b64decode)"
          - "'image: ghcr.io/haidra-org/ai-horde-stats-exporter:main' in (_compose_content.content | b64decode)"
          - "'127.0.0.1:9150:9150' in (_compose_content.content | b64decode)"
          - "'horde.app: \"ai-horde-stats-exporter\"' in (_compose_content.content | b64decode)"
          - "'horde.logs: \"true\"' in (_compose_content.content | b64decode)"
          - "'/metrics' in (_compose_content.content | b64decode)"
          - "'/etc/horde-stats-exporter/exporter_config.yaml:ro' in (_compose_content.content | b64decode)"
        fail_msg: "Compose missing expected stats-exporter shape"

    - name: Stat exporter_config.yaml
      ansible.builtin.stat:
        path: /opt/horde-stats-exporter-default/exporter_config.yaml
      register: _config

    - name: Assert exporter_config.yaml exists with expected permissions
      ansible.builtin.assert:
        that:
          - _config.stat.exists
          - _config.stat.mode == "0644"
        fail_msg: "exporter_config.yaml missing or wrong permissions"

    - name: Read exporter_config.yaml
      ansible.builtin.slurp:
        src: /opt/horde-stats-exporter-default/exporter_config.yaml
      register: _config_content

    - name: Assert config keys present
      ansible.builtin.assert:
        that:
          - "'scrape_intervals:' in (_config_content.content | b64decode)"
          - "'base_url: \"https://aihorde.net/api/v2\"' in (_config_content.content | b64decode)"
          - "'user_agent: \"horde_prometheus_exporter\"' in (_config_content.content | b64decode)"
          - "'port: 9150' in (_config_content.content | b64decode)"
        fail_msg: "exporter_config.yaml missing expected keys"

# ----------------------------------------------------------------------------
# Play 2: Image digest pin renders image@sha256:...
# ----------------------------------------------------------------------------
- name: Test horde_stats_exporter render (image digest pin)
  hosts: testhost
  become: true
  gather_facts: false
  vars:
    horde_stats_exporter_start_services: false
    horde_stats_exporter_base_dir: /opt/horde-stats-exporter-pinned
    horde_stats_exporter_image: "ghcr.io/haidra-org/ai-horde-stats-exporter:v0.3.0"
    horde_stats_exporter_image_digest: "sha256:abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789"
  roles:
    - horde_stats_exporter

  post_tasks:
    - name: Read docker-compose.yml (pinned)
      ansible.builtin.slurp:
        src: /opt/horde-stats-exporter-pinned/docker-compose.yml
      register: _compose_content_pinned

    - name: Assert compose ref includes digest suffix
      ansible.builtin.assert:
        that:
          - "'image: ghcr.io/haidra-org/ai-horde-stats-exporter:v0.3.0@sha256:abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789' in (_compose_content_pinned.content | b64decode)"
        fail_msg: "Compose image must combine tag and digest pin"

# ----------------------------------------------------------------------------
# Play 3: Invalid digest is rejected fail-fast
# ----------------------------------------------------------------------------
- name: Test horde_stats_exporter render (invalid digest fail-fast)
  hosts: testhost
  become: true
  gather_facts: false
  vars:
    horde_stats_exporter_start_services: false
    horde_stats_exporter_base_dir: /opt/horde-stats-exporter-baddigest
    horde_stats_exporter_image_digest: "sha256:not-a-real-digest"
  tasks:
    - name: Run role with invalid digest (must fail at the guard)
      block:
        - name: Include role expecting failure
          ansible.builtin.include_role:
            name: horde_stats_exporter
        - name: Force test failure if role accepted invalid digest
          ansible.builtin.fail:
            msg: "Role accepted an invalid image digest format — fail-fast guard is missing or broken"
      rescue:
        - name: Assert the failure came from the digest format guard
          ansible.builtin.assert:
            that:
              # ansible_failed_result is populated by rescue. Confirm the
              # failure was the digest assert (not, e.g., a typo elsewhere
              # that would silently pass this test if we just rescued).
              - ansible_failed_result.msg is defined
              - ansible_failed_result.msg is search('digest')
                or ansible_failed_result.msg is search('sha256')
            fail_msg: >-
              Role failed for the wrong reason — expected the
              horde_stats_exporter_image_digest format guard to trigger.
              Got: {{ ansible_failed_result }}
        - name: Confirm no compose file was rendered for the invalid case
          ansible.builtin.stat:
            path: /opt/horde-stats-exporter-baddigest/docker-compose.yml
          register: _baddigest_compose
        - name: Assert fail-fast happened before any rendering
          ansible.builtin.assert:
            that:
              - not _baddigest_compose.stat.exists
            fail_msg: >-
              Role rendered docker-compose.yml before failing on the
              digest guard — the guard must run before template tasks.
