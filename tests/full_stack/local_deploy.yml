---
# Full-stack rendering playbook — renders configs for all services
# that participate in the complete local Horde stack.
#
# Driven by tests/full_stack/local_deploy.sh — do not run directly.
# Applies both the ai_horde and aihorde_frontpage roles against
# localhost with start_services=false so only configs are rendered.
#
# The HAProxy config is a static file (local-deploy/static/haproxy/haproxy.cfg)
# and does not need to be rendered here.
# Risk category: deploy-safety, operational

- name: Render complete Horde stack configs (local deploy)
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    ai_horde_base_dir: "{{ playbook_dir }}/../../local-deploy/runtime/ai-horde"
    ai_horde_data_dir: "{{ playbook_dir }}/../../local-deploy/runtime/ai-horde/data"
    aihorde_frontpage_base_dir: "{{ playbook_dir }}/../../local-deploy/runtime/frontpage"

    # Build the AI-Horde image from the cloned source so iterative changes
    # to /root/horde/AI-Horde (or whatever upstream ref local_deploy.sh
    # checks out into runtime/ai-horde/src) are picked up by
    # `dc_backend build`. Without this, the compose only references
    # `image:` and the build step is a no-op.
    ai_horde_build_context: "./src"
    ai_horde_build_dependency_groups:
      - telemetry-profiling
    # Tag the locally-built image with a -local suffix so it can never be
    # overwritten by a `docker pull` from the registry.
    ai_horde_image: "ai-horde:local"

    # Garage S3 credentials are rendered into runtime/ai-horde/.env.garage.
    # Monitoring-enabled full-stack runs may overwrite this with the
    # monitoring Garage credentials after that stack has bootstrapped.
    ai_horde_extra_env_files:
      - .env.garage
    local_garage_attach_horde_stack: true

    ai_horde_start_services: false
    ai_horde_log_driver: "local"
    ai_horde_listen: "127.0.0.1"
    ai_horde_port: 7001

    # Load-test mode. Set true via `-e loadtest_mode=true` (local_deploy.sh
    # --loadtest). It layers production-mirrored shape onto the local stack:
    # a dedicated quorum instance, tuned embedded postgres, prod pool sizing,
    # and 25 waitress threads. Left false for the ordinary local deploy so that
    # path is byte-for-byte unchanged.
    loadtest_mode: false
    # Prod parity: 25 waitress threads per instance under load, 45 otherwise.
    ai_horde_waitress_threads: "{{ 25 if (loadtest_mode | bool) else 45 }}"
    # Dedicated quorum instance only in loadtest mode.
    ai_horde_quorum_instance_enabled: "{{ loadtest_mode | bool }}"
    # Embedded-postgres tuning mirrored from prod aihdb01 (pg15). Overridable.
    loadtest_pg_log_min_duration_ms: 1000
    loadtest_pg_max_connections: 500
    loadtest_pg_work_mem: "16MB"
    _loadtest_pg_conf:
      - "shared_preload_libraries=auto_explain,pg_stat_statements,pg_cron"
      - "log_lock_waits=on"
      - "log_min_duration_statement={{ loadtest_pg_log_min_duration_ms }}"
      - "auto_explain.log_min_duration=1000"
      - "auto_explain.log_analyze=off"
      - "autovacuum_vacuum_scale_factor=0.05"
      - "work_mem={{ loadtest_pg_work_mem }}"
      - "max_connections={{ loadtest_pg_max_connections }}"
    ai_horde_postgres_extra_conf: "{{ _loadtest_pg_conf if (loadtest_mode | bool) else [] }}"
    ai_horde_postgres_password: "localdev-postgres"
    ai_horde_secret_key: "localdev-secret-key"
    ai_horde_admins: ["test_user#1"]
    ai_horde_repo: "https://github.com/Haidra-Org/AI-Horde.git"
    ai_horde_repo_version: "main"
    ai_horde_pyroscope_enabled: "true"
    ai_horde_pyroscope_tenant_id: "ai-horde-app"
    # Embedded datastores enabled for local-deploy stack
    ai_horde_embedded_postgres_enabled: true
    ai_horde_embedded_redis_enabled: true
    ai_horde_deployment_environment: "local-deploy"

    # In local-deploy, alloy + pyroscope run as sibling containers and are
    # attached to the shared `horde-stack` network by local_deploy.sh.  We
    # override the endpoints (which default to host.docker.internal in the
    # role) so ai-horde containers reach them by service name over the
    # shared network — this avoids the IPv6 ENETUNREACH issue with
    # host.docker.internal on Linux Docker.
    _ai_horde_env_base:
      KUDOS_TRUST_THRESHOLD: "100"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy:4318"
      PYROSCOPE_SERVER_ADDRESS: "http://pyroscope:4040"
      # Flush metrics every 10 s so the OTLP smoke-test probe doesn't have to
      # wait for the 60 s production default before querying Mimir.
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
    # Prod-mirrored SQLAlchemy pool sizing, layered in only under loadtest mode.
    _ai_horde_env_loadtest:
      SQLALCHEMY_POOL_SIZE: "25"
      SQLALCHEMY_MAX_OVERFLOW: "15"
    ai_horde_env_overrides: >-
      {{ _ai_horde_env_base | combine(_ai_horde_env_loadtest if (loadtest_mode | bool) else {}) }}

    aihorde_frontpage_start_services: false
    aihorde_frontpage_build_config: local
    aihorde_frontpage_listen: "127.0.0.1"
    aihorde_frontpage_port: 8006
    aihorde_frontpage_repo: "https://github.com/Haidra-Org/AiHordeFrontpage.git"
    aihorde_frontpage_repo_version: "master"

    horde_model_reference_base_dir: "{{ playbook_dir }}/../../local-deploy/runtime/model-reference"
    horde_model_reference_data_dir: "{{ playbook_dir }}/../../local-deploy/runtime/model-reference/data"
    horde_model_reference_start_services: false
    horde_model_reference_replicate_mode: "PRIMARY"
    # One-time seed: enable when bootstrapping a fresh local stack.
    # Set to false (or remove) once the data volume is populated.
    horde_model_reference_github_seed_enabled: true
    horde_model_reference_make_folders: true
    horde_model_reference_canonical_format: "v2"
    horde_model_reference_listen: "127.0.0.1"
    horde_model_reference_port: 19800
    horde_model_reference_log_driver: "local"

    horde_service_alerts_base_dir: "{{ playbook_dir }}/../../local-deploy/runtime/service-alerts"
    horde_service_alerts_start_services: false
    horde_service_alerts_listen: "127.0.0.1"
    horde_service_alerts_port: 19810
    horde_service_alerts_log_driver: "local"
    # Dev-only secrets for the local stack (embedded Postgres + prober are on
    # by default). Never use these values outside local-deploy.
    horde_service_alerts_postgres_password: "localdev-pg-pw"
    horde_service_alerts_prober_shared_secret: "localdev-prober-secret"
    # In local-deploy, monitoring runs as sibling containers attached to the
    # shared `horde-stack` network.  Override the upstream URLs so the
    # service-alerts container reaches them by service name (and only when
    # the operator has actually enabled --with-monitoring; the role tolerates
    # unreachable upstreams via /healthz).
    horde_service_alerts_alertmanager_base_url: "http://alertmanager:9093"
    horde_service_alerts_mimir_base_url: "http://mimir:9009"

  roles:
    - ai_horde
    - aihorde_frontpage
    - horde_model_reference
    - horde_service_alerts

  post_tasks:
    - name: Render local Garage for AI-Horde R2/source-image storage
      ansible.builtin.import_tasks: ../local_garage.yml

    - name: Render AI-Horde local-deploy.env
      ansible.builtin.copy:
        content: |
          AI_HORDE_PORT={{ ai_horde_port }}
          AI_HORDE_BASE_DIR={{ ai_horde_base_dir }}
          {{ local_garage_local_deploy_env }}
        dest: "{{ ai_horde_base_dir }}/local-deploy.env"
        mode: "0644"

    - name: Ensure HAProxy config directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../local-deploy/static/haproxy"
        state: directory
        mode: "0755"

    - name: Verify HAProxy config is present
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../local-deploy/static/haproxy/haproxy.cfg"
      register: _haproxy_cfg

    - name: Fail if HAProxy config is missing
      ansible.builtin.fail:
        msg: >-
          local-deploy/static/haproxy/haproxy.cfg not found. This is a
          version-controlled static file — ensure the repo checkout
          is complete.
      when: not _haproxy_cfg.stat.exists

    # Load-test edge: rendered to runtime/ (not the static default) and mounted
    # by docker-compose.fullstack-haproxy.loadtest.yml. Only in loadtest mode.
    - name: Ensure runtime HAProxy directory exists (loadtest edge)
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../local-deploy/runtime/haproxy"
        state: directory
        mode: "0755"
      when: loadtest_mode | bool

    - name: Render load-test HAProxy edge config
      ansible.builtin.template:
        src: templates/haproxy.loadtest.cfg.j2
        dest: "{{ playbook_dir }}/../../local-deploy/runtime/haproxy/haproxy.loadtest.cfg"
        mode: "0644"
      when: loadtest_mode | bool
