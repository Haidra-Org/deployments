---
# horde_model_reference role entry point

# ── Fail-fast guards ──────────────────────────────────────────────────────────

- name: Validate replicate mode value
  ansible.builtin.assert:
    that:
      - horde_model_reference_replicate_mode | upper in ['PRIMARY', 'REPLICA']
    fail_msg: >-
      horde_model_reference_replicate_mode must be PRIMARY or REPLICA.
      Got '{{ horde_model_reference_replicate_mode }}'.

- name: Validate worker count
  ansible.builtin.assert:
    that:
      - (horde_model_reference_workers | int) >= 1
    fail_msg: >-
      horde_model_reference_workers must be >= 1.
      Got '{{ horde_model_reference_workers }}'.

- name: Fail if multi-worker PRIMARY configured without Redis
  ansible.builtin.fail:
    msg: >-
      horde_model_reference_workers={{ horde_model_reference_workers }} > 1
      requires horde_model_reference_redis_enabled: true.
      Multi-worker PRIMARY deployments need Redis for distributed cache
      invalidation across uvicorn worker processes.
  when:
    - horde_model_reference_replicate_mode | upper == 'PRIMARY'
    - (horde_model_reference_workers | int) > 1
    - not (horde_model_reference_redis_enabled | bool)

# ── GitHub sync guards ──────────────────────────────────────────────────────────

- name: Validate GitHub sync prerequisites
  when: horde_model_reference_github_sync_enabled | bool
  block:
    - name: Fail if GitHub sync is enabled outside PRIMARY mode
      ansible.builtin.fail:
        msg: >-
          horde_model_reference_github_sync_enabled requires PRIMARY mode
          (got replicate_mode='{{ horde_model_reference_replicate_mode }}').
          The sync mirrors a PRIMARY's data back to GitHub.
      when: horde_model_reference_replicate_mode | upper != 'PRIMARY'

    - name: Fail if GitHub sync has no authentication configured
      ansible.builtin.fail:
        msg: >-
          horde_model_reference_github_sync_enabled requires GitHub authentication:
          set horde_model_reference_github_sync_github_token (PAT), or all of
          horde_model_reference_github_app_id, _github_app_installation_id and
          _github_app_private_key (GitHub App installation auth).
      when:
        - (horde_model_reference_github_sync_github_token | string | length) == 0
        - not (
            (horde_model_reference_github_app_id | string | length) > 0 and
            (horde_model_reference_github_app_installation_id | string | length) > 0 and
            (horde_model_reference_github_app_private_key | string | length) > 0
          )

# ── Docker Compose deployment ─────────────────────────────────────────────────

- name: Deploy horde-model-reference via Docker Compose
  ansible.builtin.include_tasks: docker.yml

# ── HAProxy conf.d integration ────────────────────────────────────────────────

- name: Configure HAProxy conf.d drop-in
  when: horde_model_reference_haproxy_enabled | bool
  block:
    - name: Bootstrap HAProxy conf.d systemd override
      ansible.builtin.include_role:
        name: _haproxy_confd_bootstrap

    - name: Template horde-model-reference HAProxy conf.d fragment
      ansible.builtin.template:
        src: haproxy-model-reference.cfg.j2
        dest: /etc/haproxy/conf.d/horde-model-reference.cfg
        owner: root
        group: root
        mode: "0644"
      notify:
        - Restart HAProxy

    - name: Validate full HAProxy configuration (haproxy.cfg + all conf.d fragments)
      ansible.builtin.command: >-
        /usr/sbin/haproxy -c
        -f /etc/haproxy/haproxy.cfg
        -f /etc/haproxy/conf.d/
      changed_when: false
      become: true
