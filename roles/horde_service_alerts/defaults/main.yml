---
# horde_service_alerts role defaults
# See README.md for variable documentation.

# ── Service lifecycle ────────────────────────────────────────────────────────
horde_service_alerts_start_services: true

# ── Filesystem layout ────────────────────────────────────────────────────────
horde_service_alerts_base_dir: "/opt/ai-horde-service-alerts"

# ── Container image ──────────────────────────────────────────────────────────
horde_service_alerts_image: "ghcr.io/haidra-org/ai-horde-service-alerts:main"
# Optional immutable digest pin appended via '@'. When set, must match
# 'sha256:<64 hex chars>'. Leave empty to use the bare tag from
# horde_service_alerts_image.
horde_service_alerts_image_digest: ""
horde_service_alerts_container_name: "horde-service-alerts"
horde_service_alerts_log_driver: "journald"
horde_service_alerts_log_tag: "ai-horde-service-alerts"

# ── Network bind for the FastAPI service ────────────────────────────────────
horde_service_alerts_listen: "127.0.0.1"
horde_service_alerts_port: 19810

# ── Internal service env (HORDE_ALERTS_*) ───────────────────────────────────
# Upstream signal sources. Defaults assume same-host Alertmanager + Mimir
# reachable via the Docker host gateway.
horde_service_alerts_alertmanager_base_url: "http://host.docker.internal:9093"
horde_service_alerts_mimir_base_url: "http://host.docker.internal:9009"
horde_service_alerts_mimir_tenant_default: "infrastructure"

# Optional HTTP basic auth presented by the service-alerts client when calling
# upstream Alertmanager + Mimir. Required when reaching them through the
# horde_monitoring service-alerts egress HAProxy frontend; leave empty for
# direct loopback access. These should match the monitoring-side
# horde_monitoring_service_alerts_egress_auth_* credentials.
horde_service_alerts_upstream_basic_auth_user: ""
horde_service_alerts_upstream_basic_auth_password: ""

# ── AI Horde verifier ───────────────────────────────────────────────────────
horde_service_alerts_aihorde_base_url: "https://aihorde.net/api/"
horde_service_alerts_aihorde_client_agent: "ai-horde-service-alerts:0.1.0:haidra"
horde_service_alerts_moderator_cache_ttl_seconds: 60
horde_service_alerts_moderator_cache_negative_ttl_seconds: 15
horde_service_alerts_moderator_cache_max_entries: 1024

# ── Status-page database (embedded Postgres sidecar) ─────────────────────────
horde_service_alerts_enable_db: true
horde_service_alerts_embedded_postgres_enabled: true
horde_service_alerts_postgres_image: "postgres:16-alpine"
horde_service_alerts_postgres_container_name: "horde-service-alerts-postgres"
horde_service_alerts_postgres_user: "horde_status"
horde_service_alerts_postgres_db: "horde_status"
# No default password: operators MUST supply one (ops sources it from vault).
# tasks/main.yml fails fast when embedded Postgres is enabled without a password.
horde_service_alerts_postgres_password: ""

# On-host data location for the embedded Postgres.
#   EMPTY (default) -> a dedicated, stack-namespaced Docker NAMED VOLUME
#     (horde_service_alerts_postgres_volume_name). Docker stores it under its
#     own volumes dir, so it can never collide with a system Postgres data
#     directory.
#   A host path -> bind-mounted instead. It MUST NOT be a well-known Postgres
#     data path; tasks/main.yml enforces this against the denylist below.
horde_service_alerts_postgres_data_path: ""
horde_service_alerts_postgres_volume_name: "horde-service-alerts-pgdata"
# Well-known / system Postgres data paths the embedded sidecar must never reuse
# for a host bind mount (defends against clobbering a real Postgres install).
horde_service_alerts_postgres_forbidden_data_paths:
  - "/var/lib/postgresql"
  - "/var/lib/postgresql/data"
  - "/var/lib/pgsql"
  - "/var/lib/pgsql/data"
  - "/pgdata"
  - "/data/postgres"
  - "/srv/postgresql"

# SQLAlchemy URL the app connects with. Defaults to the embedded sidecar
# (reachable as the compose service name `postgres`). External-DB deployments
# override this (and typically set embedded_postgres_enabled=false).
horde_service_alerts_database_url: >-
  postgresql+asyncpg://{{ horde_service_alerts_postgres_user }}:{{ horde_service_alerts_postgres_password }}@postgres:5432/{{ horde_service_alerts_postgres_db }}

# ── Status evaluator / maintenance / backfill / tuning ───────────────────────
horde_service_alerts_enable_background_tasks: true
horde_service_alerts_status_evaluator_interval_seconds: 15
horde_service_alerts_maintenance_runner_interval_seconds: 30
horde_service_alerts_no_signal_grace_seconds: 900
# Run the one-shot Mimir backfill at startup. Set true once after first deploy,
# then back to false on the next converge.
horde_service_alerts_backfill_on_startup: false
horde_service_alerts_backfill_window_days: 90

# ── Co-located blackbox prober ───────────────────────────────────────────────
horde_service_alerts_prober_enabled: true
horde_service_alerts_prober_image: "ghcr.io/haidra-org/horde-status-prober:main"
horde_service_alerts_prober_container_name: "horde-status-prober"
horde_service_alerts_prober_log_tag: "horde-status-prober"
horde_service_alerts_prober_aihorde_base_url: "https://aihorde.net/api"
# Shared secret the prober presents on POST /internal/probe-results and the
# service validates. EMPTY disables BOTH probe ingestion (service side) and the
# prober container (no point running it). ops sources this from vault.
horde_service_alerts_prober_shared_secret: ""

# ── HTTP behaviour ──────────────────────────────────────────────────────────
horde_service_alerts_request_timeout_seconds: 5.0
horde_service_alerts_cors_allow_origins: []
horde_service_alerts_enable_internal_swagger_docs: true
horde_service_alerts_log_level: "info"

# Free-form passthrough for keys not modelled above (rendered verbatim into .env).
horde_service_alerts_env_overrides: {}

# ── HAProxy conf.d integration ──────────────────────────────────────────────
horde_service_alerts_configure_haproxy_backend: false
horde_service_alerts_haproxy_confd_path: "/etc/haproxy/conf.d/horde-service-alerts.cfg"
# Path prefix at which the public API is exposed via HAProxy. The fragment
# adds an ACL "use_backend" rule using this prefix on whichever frontend the
# operator already provides; it does NOT define its own listening frontend.
horde_service_alerts_haproxy_public_path_prefix: "/api/service-alerts/"
horde_service_alerts_haproxy_backend_name: "horde_service_alerts_backend"
horde_service_alerts_haproxy_acl_name: "is_horde_service_alerts"
