---
# Handlers for horde_stats_exporter role.

- name: Restart ai-horde-stats-exporter Docker stack
  community.docker.docker_compose_v2:
    project_src: "{{ horde_stats_exporter_base_dir }}"
    state: present
    pull: always
    build: never
  become: true
  when: horde_stats_exporter_start_services | bool
