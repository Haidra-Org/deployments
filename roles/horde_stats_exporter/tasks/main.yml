---
# horde_stats_exporter role entry point.

- name: Validate required image variable
  ansible.builtin.assert:
    that:
      - horde_stats_exporter_image | default('') | length > 0
    fail_msg: >-
      horde_stats_exporter_image must be defined (full container image
      reference, e.g. ghcr.io/haidra-org/ai-horde-stats-exporter:<tag>).

- name: Validate image digest format when provided
  ansible.builtin.assert:
    that:
      - horde_stats_exporter_image_digest is match('^sha256:[0-9a-f]{64}$')
    fail_msg: >-
      horde_stats_exporter_image_digest must be empty or match
      'sha256:<64 hex chars>'.
  when: (horde_stats_exporter_image_digest | default('') | length) > 0

- name: Deploy stats exporter via Docker Compose
  ansible.builtin.include_tasks: docker.yml
