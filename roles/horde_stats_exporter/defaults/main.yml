---
# Default variables for horde_stats_exporter role
#
# Deploys the AI Horde Prometheus exporter as a Docker Compose stack on the
# monitoring host. The container exposes /metrics on
# horde_stats_exporter_port (default 9150) for Prometheus to scrape.
#
# See roles/horde_stats_exporter/README.md for full documentation.

# ---------------------------------------------------------------------------
# Service lifecycle
# ---------------------------------------------------------------------------
horde_stats_exporter_start_services: true

# ---------------------------------------------------------------------------
# Filesystem layout
# ---------------------------------------------------------------------------
horde_stats_exporter_base_dir: "/opt/horde-stats-exporter"

# ---------------------------------------------------------------------------
# Container image
# ---------------------------------------------------------------------------
# Rolling tag from the horde-exporters repo (image-publish-main workflow).
# Pin to a release tag (e.g. v0.3.0) for reproducible deployments, or set
# horde_stats_exporter_image_digest to append an immutable @sha256:... pin.
horde_stats_exporter_image: "ghcr.io/haidra-org/ai-horde-stats-exporter:main"
horde_stats_exporter_image_digest: ""
horde_stats_exporter_container_name: "horde-stats-exporter"
horde_stats_exporter_log_driver: "journald"
horde_stats_exporter_log_tag: "ai-horde-stats-exporter"

# ---------------------------------------------------------------------------
# Exporter configuration
# ---------------------------------------------------------------------------
# Bind address for the published Docker port mapping.
horde_stats_exporter_listen: "127.0.0.1"
horde_stats_exporter_port: 9150
horde_stats_exporter_api_base_url: "https://aihorde.net/api/v2"
horde_stats_exporter_user_agent: "horde_prometheus_exporter"
horde_stats_exporter_api_timeout: 10

# ---------------------------------------------------------------------------
# Scrape intervals (seconds)
# ---------------------------------------------------------------------------
horde_stats_exporter_scrape_models: 8
horde_stats_exporter_scrape_workers: 300
horde_stats_exporter_scrape_performance: 2
horde_stats_exporter_scrape_stats: 120
horde_stats_exporter_scrape_modes: 30
horde_stats_exporter_scrape_teams: 300

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
horde_stats_exporter_log_level: INFO
